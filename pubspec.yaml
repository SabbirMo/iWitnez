name: iwitnez
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  google_fonts: ^8.2.1
  go_router: ^18.0.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  pin_code_fields: ^10.0.0
  geolocator: ^14.0.3
  permission_handler: ^11.3.1
  agora_rtc_engine: ^6.3.0
  image_picker: ^1.2.3
  camera: ^0.12.1
  video_player: ^2.14.0
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  emoji_picker_flutter: ^4.5.4
  flutter_secure_storage: ^11.2.0
  web_socket_channel: ^3.0.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  google_maps_flutter: ^2.19.0
  flutter_dotenv: ^6.0.1
  geocoding: ^5.0.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/main_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/main_logo.png"


flutter:


  uses-material-design: true

  assets:
    - .env
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/svg/
    - assets/audio/
    - assets/video/
    - assets/dark_images/
 
